name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish'
        required: true
      metabase-version:
        description: 'Metabase version'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name || 'develop' }}
      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install clojure tools
        # v13.4
        uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f
        with:
          lein: '2.9.10'

      - name: "Install dependencies"
        env:
          METABASE_VERSION: ${{ github.event.inputs.metabase-version || vars.METABASE_VERSION }}
        run: |
          lein get-metabase-core
          lein deps

      - name: Import GPG key
        # v6.3
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GRADLE_SIGNING_KEY }}
          passphrase: ${{ secrets.GRADLE_SIGNING_PASSWORD }}

      - name: "Build uberjar"
        id: build
        run: |
          DEBUG=1 lein uberjar
          echo "version=$(lein project-version | tail -1)" >> "${GITHUB_OUTPUT}"
          echo "jar-name=$(lein file-name | tail -1)" >> "${GITHUB_OUTPUT}"


      - uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: target/default+uberjar/${{ steps.build.outputs.jar-name }}
          tags: true
          draft: false

      - name: Upload resulting jar file as artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.jar-name }}
          path: target/default+uberjar/${{ steps.build.outputs.jar-name }}
